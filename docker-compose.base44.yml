name: kotlin-ir-explorer

services:
  # The Kotlin (Ktor) backend that compiles Kotlin code into the Mermaid IR graph.
  # Its source is NOT part of this repository (this repo only holds the React
  # frontend, which normally ships as a static bundle inside the backend image),
  # so it runs here as the upstream image the project publishes.
  api:
    image: yairm210/kotlin-ir-explorer:latest
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -X POST -H 'Content-Type: text/plain' --data 'fun main() {}' 'http://127.0.0.1:8080/api/kotlinToMermaid?withOffsetComment=true' >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s

  web:
    image: node:22
    working_dir: /app
    # Dependencies are installed on startup from the mounted lockfile, then the
    # Vite dev server runs from the bind-mounted source so edits hot-reload.
    command:
      [
        "sh",
        "-ec",
        "npm ci --no-audit --no-fund && exec npm start -- --host 0.0.0.0 --port 3000 --strictPort",
      ]
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - KOTLIN_IR_API_URL=http://api:8080
      # Platform-provided; Vite appends it to server.allowedHosts (Vite >= 6.1).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      base44.project: "Kotlin IR Explorer"
      base44.kind: web
      base44.port: "3000"

volumes:
  web_node_modules:
